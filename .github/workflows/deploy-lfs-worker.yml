# Redeploys the Git LFS Worker (_tools/lfs-worker) as factorio-blueprints-lfs.
# The Worker must already exist: CLOUDFLARE_API_TOKEN can update it but not
# create it. LFS_UPLOAD_TOKEN is set on the Worker separately and survives.

name: Deploy LFS Worker

on:
  push:
    branches: [main]
    paths: ["_tools/lfs-worker/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-lfs-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _tools/lfs-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: _tools/lfs-worker/package-lock.json
      - run: npm ci
      - run: npx tsc -p .
      # Uses the wrangler version installed by npm ci.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: _tools/lfs-worker
          packageManager: npm
