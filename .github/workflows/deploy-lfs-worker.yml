# Deploys the Git LFS Worker in _tools/lfs-worker to Cloudflare as
# "factorio-blueprints-lfs" (https://factorio-blueprints-lfs.abucnasty.workers.dev).
#
# FIRST DEPLOY MUST BE DONE MANUALLY. The CLOUDFLARE_API_TOKEN secret can update
# an existing Worker but cannot create a new one, so this workflow fails until
# the Worker has been deployed once by hand. See _tools/docs/render-storage.md.
#
# This workflow never sets LFS_UPLOAD_TOKEN. That secret is set once on the
# Worker by hand and survives later deploys.

name: Deploy LFS Worker

on:
  push:
    branches: [main]
    paths:
      - "_tools/lfs-worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lfs-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _tools/lfs-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: _tools/lfs-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # wrangler-action uses the wrangler installed by npm ci above (the
      # version in package-lock.json) because wranglerVersion is not set.
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: _tools/lfs-worker
          packageManager: npm
          command: deploy
