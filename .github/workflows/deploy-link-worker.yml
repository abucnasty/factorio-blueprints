# Type-checks and tests the link Worker (_tools/link-worker) and, outside
# pull requests, redeploys it as factorio-blueprints-links. The Worker must
# already exist: CLOUDFLARE_API_TOKEN can update it but not create it.

name: Deploy link Worker

on:
  push:
    branches: [main]
    paths:
      - "_tools/link-worker/**"
      - "_tools/ci/catalog-index.ts"
      - ".github/workflows/deploy-link-worker.yml"
  pull_request:
    paths:
      - "_tools/link-worker/**"
      - "_tools/ci/catalog-index.ts"
      - ".github/workflows/deploy-link-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency: ${{ github.event_name == 'pull_request' && format('link-worker-pr-{0}', github.event.pull_request.number) || 'deploy-link-worker' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _tools/link-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: _tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: _tools/link-worker/package-lock.json
      - run: npm ci
      - run: npx tsc -p .
      - run: npm test
      # Uses the wrangler version installed by npm ci.
      - if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: _tools/link-worker
          packageManager: npm
