# Validates the blueprint catalog on every pull request. On pushes to main
# (the vault pushes there directly) it publishes it for the link Worker:
# the blueprint strings the live index.json lacks, then index.json, to the
# factorio-blueprints-catalog R2 bucket (served at vault.abucnasty.dev).
# The versions are the ones each blueprint's versions.json records (the
# plugin writes it; this job only reads it), so no git history is needed. An invalid blueprint does not hold
# up the others: it is listed in the step summary, keeps its last published
# version, and the run fails after the valid ones are live. A blueprint whose
# content changed without a new version is listed too and keeps its last
# version, but does not fail the run. Run it by hand on main with "backfill"
# to upload every string of every current version again.
name: publish catalog

# Only blueprints/ is catalog content (other top-level folders are not
# published), so runs start for it and for the tools that build the
# catalog. Keep the two lists the same.
on:
  pull_request:
    paths:
      - "blueprints/**"
      - "_tools/ci/**"
      - "_tools/plugin/**"
      - "_tools/link-worker/package*.json"
      - ".github/workflows/publish-catalog.yml"
  push:
    branches: [main]
    paths:
      - "blueprints/**"
      - "_tools/ci/**"
      - "_tools/plugin/**"
      - "_tools/link-worker/package*.json"
      - ".github/workflows/publish-catalog.yml"
  workflow_dispatch:
    inputs:
      backfill:
        description: Upload every string of every current version, not just the missing ones
        type: boolean
        default: false

permissions:
  contents: read

# Publishes run one at a time and are never cancelled midway. If several
# pushes queue up, GitHub keeps only the newest waiting run; that is fine,
# as a publish uploads whatever the live index lacks. Pull requests cancel
# their own older runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('catalog-pr-{0}', github.event.pull_request.number) || 'publish-catalog' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never download render images; the tools read their LFS pointers from git.
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pushed commit only: versions come from versions.json, not
          # the history. No sparse checkout: it makes the clone partial, and
          # blobs then cannot be read once credentials are gone.
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            _tools/plugin/package-lock.json
            _tools/link-worker/package-lock.json

      # Pull requests also type-check and test the tools; tooling reaches
      # main only through one, so pushes install just the core's runtime.
      - name: Install the core and test tools
        if: github.event_name == 'pull_request'
        working-directory: _tools/plugin
        run: npm ci
      - name: Install the core
        if: github.event_name != 'pull_request'
        working-directory: _tools/plugin
        run: npm ci --omit=dev
      - name: Type-check and test the tools
        if: github.event_name == 'pull_request'
        working-directory: _tools/ci
        run: |
          ../plugin/node_modules/.bin/tsc -p .
          node --test "test/**/*.test.ts"

      # Publishing validates too, but publishes the valid blueprints first.
      - name: Validate
        if: env.PUBLISH != 'true'
        run: node _tools/ci/catalog.ts validate

      - name: Install wrangler
        if: env.PUBLISH == 'true'
        working-directory: _tools/link-worker
        run: npm ci
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          MODE: ${{ inputs.backfill && 'backfill' || 'publish' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node _tools/ci/catalog.ts "$MODE"
