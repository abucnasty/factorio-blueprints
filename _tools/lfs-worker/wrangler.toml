name = "factorio-blueprints-lfs"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# R2 bucket binding. The bucket already exists in the account; it is not
# created by this config or by CI.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "factorio-blueprints-lfs"

# Secrets (never commit these — set them once via CLI):
#   wrangler secret put LFS_UPLOAD_TOKEN
#
# Local dev — copy .dev.vars.example to .dev.vars and fill in values.
